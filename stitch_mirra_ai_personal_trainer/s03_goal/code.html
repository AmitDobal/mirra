  </head><body class="bg-background font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-background pt-safe pb-safe"><div class="flex flex-col w-full px-5 pb-8 relative select-none">
<!-- Top Navigation & Progress Header -->
<div class="flex items-center justify-between w-full pt-2 pb-3">
<button aria-label="Go back" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-transform active:scale-95" type="button">
<span class="material-symbols-outlined text-[24px]">chevron_left</span>
</button>
<div class="flex items-center gap-2">
<span class="font-label-caps text-label-caps text-on-surface-variant font-bold">1 / 8</span>
</div>
</div>
<!-- Linear Step Progress Bar -->
<div class="w-full h-1 bg-surface-container-high rounded-full overflow-hidden mb-6">
<div class="h-full bg-primary-fixed rounded-full w-[12.5%] transition-all duration-300"></div>
</div>
<!-- Screen Heading -->
<div class="flex flex-col mb-6">
<h1 class="font-headline-md text-headline-md text-on-surface font-bold tracking-tight">What’s the main goal?</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant mt-1.5 uppercase tracking-wider">Pick one. You can change later.</p>
</div>
<!-- Goal Selection List -->
<div aria-label="Fitness Main Goal" class="flex flex-col gap-3 w-full" id="goal-options" role="radiogroup">
<!-- Option 1: Lose Fat -->
<div aria-checked="false" class="goal-item relative flex items-center justify-between w-full p-4 rounded-[18px] bg-surface-container-low transition-all duration-200 cursor-pointer hover:bg-surface-container active:scale-[0.99] overflow-hidden" onclick="selectGoal(this)" role="radio" tabindex="0">
<div class="indicator-bar absolute left-0 top-0 bottom-0 w-1.5 bg-transparent transition-colors duration-200"></div>
<div class="flex items-center gap-3.5 pl-1.5">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">local_fire_department</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Lose fat</span>
</div>
<div class="radio-disc w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center text-transparent transition-colors">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</div>
<!-- Option 2: Build Muscle (SELECTED STATE) -->
<div aria-checked="true" class="goal-item relative flex items-center justify-between w-full p-4 rounded-[18px] bg-surface-container-high transition-all duration-200 cursor-pointer active:scale-[0.99] overflow-hidden shadow-sm" onclick="selectGoal(this)" role="radio" tabindex="0">
<div class="indicator-bar absolute left-0 top-0 bottom-0 w-1.5 bg-primary-fixed transition-colors duration-200"></div>
<div class="flex items-center gap-3.5 pl-1.5">
<div class="w-10 h-10 rounded-full bg-primary-fixed/20 flex items-center justify-center text-primary-fixed">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Build muscle</span>
</div>
<div class="radio-disc w-6 h-6 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed transition-colors">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</div>
<!-- Option 3: Recomp -->
<div aria-checked="false" class="goal-item relative flex items-center justify-between w-full p-4 rounded-[18px] bg-surface-container-low transition-all duration-200 cursor-pointer hover:bg-surface-container active:scale-[0.99] overflow-hidden" onclick="selectGoal(this)" role="radio" tabindex="0">
<div class="indicator-bar absolute left-0 top-0 bottom-0 w-1.5 bg-transparent transition-colors duration-200"></div>
<div class="flex items-center gap-3.5 pl-1.5">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">sync_alt</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Recomp</span>
</div>
<div class="radio-disc w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center text-transparent transition-colors">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</div>
<!-- Option 4: Get Consistent -->
<div aria-checked="false" class="goal-item relative flex items-center justify-between w-full p-4 rounded-[18px] bg-surface-container-low transition-all duration-200 cursor-pointer hover:bg-surface-container active:scale-[0.99] overflow-hidden" onclick="selectGoal(this)" role="radio" tabindex="0">
<div class="indicator-bar absolute left-0 top-0 bottom-0 w-1.5 bg-transparent transition-colors duration-200"></div>
<div class="flex items-center gap-3.5 pl-1.5">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">calendar_today</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Get consistent</span>
</div>
<div class="radio-disc w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center text-transparent transition-colors">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</div>
<!-- Option 5: Performance -->
<div aria-checked="false" class="goal-item relative flex items-center justify-between w-full p-4 rounded-[18px] bg-surface-container-low transition-all duration-200 cursor-pointer hover:bg-surface-container active:scale-[0.99] overflow-hidden" onclick="selectGoal(this)" role="radio" tabindex="0">
<div class="indicator-bar absolute left-0 top-0 bottom-0 w-1.5 bg-transparent transition-colors duration-200"></div>
<div class="flex items-center gap-3.5 pl-1.5">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">bolt</span>
</div>
<span class="font-headline-sm text-headline-sm text-on-surface font-semibold tracking-tight">Performance</span>
</div>
<div class="radio-disc w-6 h-6 rounded-full bg-surface-container-high flex items-center justify-center text-transparent transition-colors">
<span class="material-symbols-outlined text-[16px] font-bold">check</span>
</div>
</div>
</div>
<!-- Tactile Kinetic Micro-Callout -->
<div class="mt-6 flex items-center justify-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-[16px] text-secondary">tune</span>
<span class="font-body-sm text-body-sm">AI adapts intensity after 3 tracked sessions</span>
</div>
<!-- Sticky Bottom Button Region -->
<div class="pt-8 pb-2 w-full mt-auto">
<button class="w-full h-14 bg-primary-fixed rounded-full flex items-center justify-center font-label-lg text-label-lg text-on-primary-fixed font-bold tracking-wide active:scale-[0.98] transition-transform duration-150 shadow-md" type="button">
      Continue
    </button>
</div>
</div>
<script>
  function selectGoal(element) {
    const parent = document.getElementById('goal-options');
    const items = parent.querySelectorAll('.goal-item');

    items.forEach(item => {
      item.setAttribute('aria-checked', 'false');
      item.classList.remove('bg-surface-container-high', 'shadow-sm');
      item.classList.add('bg-surface-container-low');

      const bar = item.querySelector('.indicator-bar');
      bar.classList.remove('bg-primary-fixed');
      bar.classList.add('bg-transparent');

      const iconBox = item.querySelector('.flex.items-center.gap-3\\.5 > div');
      iconBox.classList.remove('bg-primary-fixed/20', 'text-primary-fixed');
      iconBox.classList.add('bg-surface-container-high', 'text-on-surface-variant');

      const radio = item.querySelector('.radio-disc');
      radio.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
      radio.classList.add('bg-surface-container-high', 'text-transparent');
    });

    element.setAttribute('aria-checked', 'true');
    element.classList.remove('bg-surface-container-low');
    element.classList.add('bg-surface-container-high', 'shadow-sm');

    const activeBar = element.querySelector('.indicator-bar');
    activeBar.classList.remove('bg-transparent');
    activeBar.classList.add('bg-primary-fixed');

    const activeIconBox = element.querySelector('.flex.items-center.gap-3\\.5 > div');
    activeIconBox.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
    activeIconBox.classList.add('bg-primary-fixed/20', 'text-primary-fixed');

    const activeRadio = element.querySelector('.radio-disc');
    activeRadio.classList.remove('bg-surface-container-high', 'text-transparent');
    activeRadio.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
  }
</script></main></body></html>
