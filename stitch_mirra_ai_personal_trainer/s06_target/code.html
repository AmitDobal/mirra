ne-sm": ["Space Grotesk"], "body-sm": ["Plus Jakarta Sans"], "display-lg": ["Space Grotesk"], "body-md": ["Plus Jakarta Sans"], "headline-md": ["Space Grotesk"], "display-metric": ["Space Grotesk"], "label-lg": ["Space Grotesk"], "body-lg": ["Plus Jakarta Sans"], "label-caps": ["Space Grotesk"], "label-md": ["Space Grotesk"], "headline-lg": ["Space Grotesk"] }, "fontSize": { "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "display-lg": ["48px", { "lineHeight": "52px", "letterSpacing": "-0.03em", "fontWeight": "700" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "headline-md": ["22px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "display-metric": ["38px", { "lineHeight": "42px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "label-lg": ["14px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "500" }], "label-caps": ["11px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.02em", "fontWeight": "700" }] } } } };</script><style>@layer base{html,body{width:100%;min-height:100%;margin:0;padding:0;background-color:#131313;color:#e5e2e1;}body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><style>

    }
  </style>
  </head><body class="bg-background font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-background pt-safe pb-safe"><div class="flex flex-col w-full px-5 pb-8 relative select-none">
<!-- Top Navigation & Progress Header -->
<div class="flex items-center justify-between pt-2 pb-5">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container active:scale-95 transition-transform text-on-surface" type="button">
<span class="material-symbols-outlined text-[20px]">chevron_left</span>
</button>
<div class="flex flex-col items-center gap-1.5 flex-1 px-4 max-w-[180px]">
<div class="w-full bg-surface-container h-1.5 rounded-full overflow-hidden">
<div class="bg-primary-fixed h-full rounded-full w-1/2 transition-all duration-500 ease-out"></div>
</div>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-wider uppercase">4 / 8</span>
</div>
<div class="w-10 h-10 flex items-center justify-center">
<span class="font-label-md text-label-md text-on-surface-variant">Step 4</span>
</div>
</div>
<!-- Screen Heading -->
<div class="flex flex-col gap-1 mb-6">
<span class="font-label-caps text-label-caps text-primary-fixed uppercase tracking-widest">Setup Plan</span>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Target</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Define your baseline target weight and pacing calibration for custom calorie budgeting.</p>
</div>
<!-- Main Target Card -->
<div class="flex flex-col gap-6 bg-surface-container-low rounded-lg p-5 shadow-xl relative overflow-hidden">
<!-- Goal Weight Selector Section -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider" for="weight-input">Goal weight</label>
<span class="font-label-caps text-label-caps text-secondary px-2.5 py-1 rounded-full bg-secondary-container/40">Healthy Target</span>
</div>
<!-- Quantitative Display & Numeric Adjustment -->
<div class="flex items-center justify-between bg-surface-container rounded-DEFAULT px-4 py-4">
<button aria-label="Decrease weight" class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface active:scale-90 transition-transform" id="btn-decrement" type="button">
<span class="material-symbols-outlined text-[22px]">remove</span>
</button>
<div class="flex items-baseline justify-center gap-1.5">
<input class="w-24 bg-transparent font-display-lg text-display-lg text-center text-primary focus:outline-none p-0 tracking-tighter" id="weight-input" max="200" min="40" type="number" value="70"/>
<span class="font-headline-md text-headline-md text-on-surface-variant font-bold">kg</span>
</div>
<button aria-label="Increase weight" class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface active:scale-90 transition-transform" id="btn-increment" type="button">
<span class="material-symbols-outlined text-[22px]">add</span>
</button>
</div>
<!-- Quick Guidance Metric Bar -->
<div class="flex items-center justify-between px-1 text-on-surface-variant font-body-sm text-body-sm">
<span>Current: 76.4 kg</span>
<span class="text-primary-fixed font-label-md text-label-md font-semibold">-6.4 kg overall</span>
</div>
</div>
<!-- Separator accent dot row -->
<div class="w-full flex items-center justify-center gap-1.5 opacity-25">
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
<span class="w-1 h-1 rounded-full bg-outline"></span>
</div>
<!-- Pace Selection Section -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Pace</span>
<span class="font-body-sm text-body-sm text-secondary" id="estimated-date">Target: ~12 Weeks</span>
</div>
<!-- Segmented Pill Options -->
<div aria-label="Pace selection" class="grid grid-cols-2 gap-3" role="radiogroup">
<!-- Steady (Active by Default) -->
<button aria-checked="true" class="flex flex-col items-start gap-1 p-3.5 rounded-DEFAULT bg-primary-container text-on-primary-container transition-all active:scale-[0.98] text-left" id="pace-steady" role="radio" type="button">
<div class="w-full flex items-center justify-between">
<span class="font-headline-sm text-headline-sm font-bold">Steady</span>
<span class="material-symbols-outlined text-[18px]">check_circle</span>
</div>
<span class="font-label-caps text-label-caps px-2 py-0.5 rounded-full bg-on-primary-container/15 font-bold tracking-tight">
            ~0.5 kg / week
          </span>
<span class="font-body-sm text-body-sm mt-1 opacity-90">Sustainable fat loss &amp; muscle retention</span>
</button>
<!-- Aggressive (Inactive by Default) -->
<button aria-checked="false" class="flex flex-col items-start gap-1 p-3.5 rounded-DEFAULT bg-surface-container text-on-surface-variant transition-all active:scale-[0.98] text-left" id="pace-aggressive" role="radio" type="button">
<div class="w-full flex items-center justify-between">
<span class="font-headline-sm text-headline-sm font-bold text-on-surface">Aggressive</span>
<span class="material-symbols-outlined text-[18px] opacity-40">radio_button_unchecked</span>
</div>
<span class="font-label-caps text-label-caps px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-bold tracking-tight">
            ~1.0 kg / week
          </span>
<span class="font-body-sm text-body-sm mt-1 text-on-surface-variant/70">Strict calorie deficit &amp; high volume</span>
</button>
</div>
</div>
</div>
<!-- Motivational Athlete Context Card -->
<div class="mt-4 bg-surface-container rounded-DEFAULT p-4 flex items-center gap-4">
<div class="w-14 h-14 rounded-full overflow-hidden flex-shrink-0 bg-surface-container-high">
<img class="w-full h-full object-cover" data-alt="High performance male athlete tying training shoes in a minimalist dark gym setting with neon lime backlights, moody athletic studio lighting, clean background, 8k professional sports editorial photography." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCmfmavlZvxJ8oQXpGKl-LF1wYViHfI3Fkmm_AkWP7RB25ahDgEtFZBjCAnTPtsVMgEIdshD-nBbzsTdvtuV5j6b94GiQCqkQRVLRckASRdSPnai72K93tMlaXRzkkkR8TwurYNA5KoY-azRGpo_CTFTQaBpBBQoyqki4aiRcqZlOpgT_sp5F2Tpbw7UlYrpFYDJqbYV5ELx5xWiCZx_cQtux3lew3JLfLlE-4rWi4v"/>
</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-secondary font-semibold">Adaptive Projection</span>
<p class="font-body-sm text-body-sm text-on-surface-variant line-clamp-2">Mirra recalculates metabolic rate each Sunday based on logged check-ins.</p>
</div>
</div>
<!-- Sticky Bottom Controls Container -->
<div class="flex flex-col items-center gap-3 mt-8 pt-2">
<button class="w-full h-14 rounded-full bg-primary-container text-on-primary-container font-label-lg text-label-lg font-bold flex items-center justify-center gap-2 active:scale-[0.97] transition-transform shadow-lg shadow-primary-container/10" id="btn-continue" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="py-2.5 px-4 font-body-sm text-body-sm text-on-surface-variant active:text-on-surface transition-colors" type="button">
      Skip target weight
    </button>
</div>
</div>
<script>
  (function() {
    const input = document.getElementById('weight-input');
    const decBtn = document.getElementById('btn-decrement');
    const incBtn = document.getElementById('btn-increment');
    const paceSteady = document.getElementById('pace-steady');
    const paceAggressive = document.getElementById('pace-aggressive');
    const dateLabel = document.getElementById('estimated-date');

    let currentPace = 'steady';

    function updateCalculations() {
      const val = parseFloat(input.value) || 70;
      const diff = 76.4 - val;
      if (diff <= 0) {
        dateLabel.textContent = "Maintain Mode";
        return;
      }
      const rate = currentPace === 'steady' ? 0.5 : 1.0;
      const weeks = Math.max(1, Math.round(diff / rate));
      dateLabel.textContent = "Target: ~" + weeks + " Weeks";
    }

    if (decBtn && input) {
      decBtn.addEventListener('click', () => {
        let val = parseInt(input.value, 10) || 70;
        if (val > 40) {
          input.value = val - 1;
          updateCalculations();
        }
      });
    }

    if (incBtn && input) {
      incBtn.addEventListener('click', () => {
        let val = parseInt(input.value, 10) || 70;
        if (val < 180) {
          input.value = val + 1;
          updateCalculations();
        }
      });
    }

    if (input) {
      input.addEventListener('change', updateCalculations);
      input.addEventListener('input', updateCalculations);
    }

    function setPace(mode) {
      currentPace = mode;
      if (mode === 'steady') {
        paceSteady.className = 'flex flex-col items-start gap-1 p-3.5 rounded-DEFAULT bg-primary-container text-on-primary-container transition-all active:scale-[0.98] text-left';
        paceSteady.querySelector('.material-symbols-outlined').textContent = 'check_circle';
        paceSteady.querySelector('.material-symbols-outlined').classList.remove('opacity-40');
        
        paceAggressive.className = 'flex flex-col items-start gap-1 p-3.5 rounded-DEFAULT bg-surface-container text-on-surface-variant transition-all active:scale-[0.98] text-left';
        paceAggressive.querySelector('.material-symbols-outlined').textContent = 'radio_button_unchecked';
        paceAggressive.querySelector('.material-symbols-outlined').classList.add('opacity-40');
      } else {
        paceAggressive.className = 'flex flex-col items-start gap-1 p-3.5 rounded-DEFAULT bg-primary-container text-on-primary-container transition-all active:scale-[0.98] text-left';
        paceAggressive.querySelector('.material-symbols-outlined').textContent = 'check_circle';
        paceAggressive.querySelector('.material-symbols-outlined').classList.remove('opacity-40');

        paceSteady.className = 'flex flex-col items-start gap-1 p-3.5 rounded-DEFAULT bg-surface-container text-on-surface-variant transition-all active:scale-[0.98] text-left';
        paceSteady.querySelector('.material-symbols-outlined').textContent = 'radio_button_unchecked';
        paceSteady.querySelector('.material-symbols-outlined').classList.add('opacity-40');
      }
      updateCalculations();
    }

    if (paceSteady) {
      paceSteady.addEventListener('click', () => setPace('steady'));
    }
    if (paceAggressive) {
      paceAggressive.addEventListener('click', () => setPace('aggressive'));
    }

    updateCalculations();
  })();
</script></main></body></html>
