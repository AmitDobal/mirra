<!-- Top Navigation & Progress Bar -->
<header class="flex flex-col gap-space-sm pt-2 mb-space-lg">
<div class="flex items-center justify-between">
<button aria-label="Go back" class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full bg-surface-container active:scale-95 transition-transform text-on-surface" type="button">

</div>

<span class="font-label-caps text-label-caps text-primary-fixed uppercase tracking-widest font-bold">

<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
      Select all available equipment so Mirra builds your exercises accurately.
    </p>
</section>
<!-- Interactive Equipment Pill Multi-Select -->
<section aria-label="Available Equipment Options" class="flex flex-wrap gap-2.5 mb-space-xl" id="equipment-selector" role="group">
<!-- Full Gym (Selected) -->
<button class="equipment-pill flex items-center gap-2 px-5 py-3 rounded-full font-label-lg text-label-lg transition-all active:scale-95 bg-primary-fixed text-on-primary-fixed shadow-sm" data-selected="true" type="button">
<span class="material-symbols-outlined text-body-lg leading-none check-icon">check</span>
<span>Full gym</span>
</button>
<!-- Dumbbells (Selected) -->
<button class="equipment-pill flex items-center gap-2 px-5 py-3 rounded-full font-label-lg text-label-lg transition-all active:scale-95 bg-primary-fixed text-on-primary-fixed shadow-sm" data-selected="true" type="button">
<span class="material-symbols-outlined text-body-lg leading-none check-icon">check</span>
<span>Dumbbells</span>
</button>
<!-- Barbell (Selected) -->
<button class="equipment-pill flex items-center gap-2 px-5 py-3 rounded-full font-label-lg text-label-lg transition-all active:scale-95 bg-primary-fixed text-on-primary-fixed shadow-sm" data-selected="true" type="button">
<span class="material-symbols-outlined text-body-lg leading-none check-icon">check</span>

</button>

<span class="material-symbols-outlined text-body-lg leading-none check-icon hidden">check</span>

</button>

<span class="material-symbols-outlined text-body-lg leading-none check-icon hidden">check</span>
<span>Cables</span>
</button>
<!-- Bands (Unselected) -->
<button class="equipment-pill flex items-center gap-2 px-5 py-3 rounded-full font-label-lg text-label-lg transition-all active:scale-95 bg-surface-container-low text-on-surface" data-selected="false" type="button">
<span class="material-symbols-outlined text-body-lg leading-none check-icon hidden">check</span>
<span>Bands</span>

<span class="material-symbols-outlined text-body-lg leading-none check-icon hidden">check</span>

<span>Continue</span>
<span class="material-symbols-outlined text-body-lg">arrow_forward</span>
</button>
</div>
</div>
<script>
  // Simple multi-select toggle handling for equipment pills
  document.querySelectorAll('#equipment-selector .equipment-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      const isSelected = pill.getAttribute('data-selected') === 'true';
      const checkIcon = pill.querySelector('.check-icon');

      if (isSelected) {
        pill.setAttribute('data-selected', 'false');
        pill.classList.remove('bg-primary-fixed', 'text-on-primary-fixed', 'shadow-sm');
        pill.classList.add('bg-surface-container-low', 'text-on-surface');
        if (checkIcon) checkIcon.classList.add('hidden');
      } else {
        pill.setAttribute('data-selected', 'true');
        pill.classList.remove('bg-surface-container-low', 'text-on-surface');
        pill.classList.add('bg-primary-fixed', 'text-on-primary-fixed', 'shadow-sm');
        if (checkIcon) checkIcon.classList.remove('hidden');
      }
    });
  });
</script></main></body></html>
