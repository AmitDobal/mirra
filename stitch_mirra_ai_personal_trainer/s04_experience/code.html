  </head><body class="bg-background font-body-md text-body-md text-on-surface flex flex-col min-h-screen selection:bg-primary-container selection:text-on-primary-container"><main class="flex-1 flex flex-col relative w-full bg-background pt-safe pb-safe"><div class="flex flex-col w-full px-5 pb-8 relative selection:bg-primary-container selection:text-on-primary-container">

<header class="flex flex-col w-full pt-4 pb-6 gap-5">
<div class="flex items-center justify-between w-full">
<button aria-label="Go back" class="flex items-center justify-center w-11 h-11 rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface" type="button">
<span class="material-symbols-outlined text-[22px]">arrow_back_ios_new</span>
</button>
<div class="flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-surface-container-low">
<span class="font-headline-sm text-label-caps text-primary-fixed tracking-widest font-bold">STEP</span>
<span class="font-headline-sm text-label-md text-on-surface font-bold">2 <span class="text-outline">/</span> 8</span>
</div>
<button aria-label="Help and Info" class="flex items-center justify-center w-11 h-11 rounded-full bg-surface-container hover:bg-surface-container-high text-outline transition-all active:scale-95" type="button">
<span class="material-symbols-outlined text-[20px]">help_outline</span>
</button>
</div>
<!-- Segmented Linear Progress Indicator (~25% completion) -->
<div class="w-full bg-surface-container-high h-1.5 rounded-full overflow-hidden flex">
<div class="h-full bg-primary-fixed w-1/4 rounded-full transition-all duration-500 shadow-[0_0_12px_rgba(203,241,80,0.5)]"></div>
</div>
</header>
<!-- Title & Visual Framing -->
<section class="flex flex-col w-full mb-6">
<div class="inline-flex items-center gap-2 mb-2">
<span class="w-2 h-2 rounded-full bg-primary-fixed animate-pulse"></span>
<span class="font-label-caps text-label-caps text-primary-fixed uppercase tracking-wider">Calibration Profile</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">
      Training experience?
    </h1>
<p class="font-body-md text-body-md text-outline mt-1.5">
      Mirra optimizes your load intensity and warm-up cycles based on your athletic background.
    </p>
</section>
<!-- Experience Option Selection Group -->
<form class="flex flex-col gap-3.5 w-full" id="experience-form">
<!-- Option 1: New -->
<label class="group relative flex items-center justify-between p-4.5 rounded-[1.25rem] bg-surface-container-low hover:bg-surface-container cursor-pointer transition-all duration-200 active:scale-[0.985]">
<input class="sr-only peer" name="experience_level" type="radio" value="new"/>
<div class="flex items-center gap-4 min-w-0">
<div class="flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">flag</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">New</span>
<span class="font-body-sm text-body-sm text-outline truncate">Under 3 months or starting fresh</span>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center transition-all peer-checked:bg-primary-fixed">
<span class="material-symbols-outlined text-[16px] text-surface-container-lowest font-bold opacity-0 transition-opacity peer-checked:opacity-100">check</span>
</div>
</label>
<!-- Option 2: Some months -->
<label class="group relative flex items-center justify-between p-4.5 rounded-[1.25rem] bg-surface-container-low hover:bg-surface-container cursor-pointer transition-all duration-200 active:scale-[0.985]">
<input class="sr-only peer" name="experience_level" type="radio" value="some_months"/>
<div class="flex items-center gap-4 min-w-0">
<div class="flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">trending_up</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">Some months</span>
<span class="font-body-sm text-body-sm text-outline truncate">3 to 11 months of regular workouts</span>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center transition-all peer-checked:bg-primary-fixed">
<span class="material-symbols-outlined text-[16px] text-surface-container-lowest font-bold opacity-0 transition-opacity peer-checked:opacity-100">check</span>
</div>
</label>
<!-- Option 3: 1–2 years (SELECTED by default per brief) -->
<label class="experience-card relative flex items-center justify-between p-4.5 rounded-[1.25rem] bg-surface-container-low cursor-pointer transition-all duration-200 active:scale-[0.985]">
<input checked="" class="sr-only peer" name="experience_level" type="radio" value="1_2_years"/>
<!-- Selected State Indicator Halo / Tint Layer -->
<div class="absolute inset-0 rounded-[1.25rem] bg-primary-container/10 peer-checked:opacity-100 opacity-0 pointer-events-none transition-opacity"></div>
<div class="flex items-center gap-4 min-w-0 z-10">
<div class="flex items-center justify-center w-12 h-12 rounded-xl bg-primary-fixed text-on-primary-fixed shadow-sm">
<span class="material-symbols-outlined text-[24px]" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<div class="flex flex-col min-w-0">
<div class="flex items-center gap-2">
<span class="font-headline-sm text-headline-sm text-primary font-bold tracking-tight">1–2 years</span>
<span class="font-label-caps text-label-caps px-2 py-0.5 rounded-full bg-primary-fixed text-on-primary-fixed font-bold tracking-wide uppercase">Optimal</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant truncate">Familiar with compound movements</span>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-primary-fixed flex items-center justify-center transition-all z-10 shadow-sm">
<span class="material-symbols-outlined text-[16px] text-on-primary-fixed font-bold">check</span>
</div>
</label>
<!-- Option 4: 3+ years -->
<label class="group relative flex items-center justify-between p-4.5 rounded-[1.25rem] bg-surface-container-low hover:bg-surface-container cursor-pointer transition-all duration-200 active:scale-[0.985]">
<input class="sr-only peer" name="experience_level" type="radio" value="3_plus_years"/>
<div class="flex items-center gap-4 min-w-0">
<div class="flex items-center justify-center w-12 h-12 rounded-xl bg-surface-container text-on-surface-variant group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-[24px]">bolt</span>
</div>
<div class="flex flex-col min-w-0">
<span class="font-headline-sm text-headline-sm text-on-surface tracking-tight">3+ years</span>
<span class="font-body-sm text-body-sm text-outline truncate">Advanced conditioning &amp; periodization</span>
</div>
</div>
<div class="w-6 h-6 rounded-full bg-surface-container-highest flex items-center justify-center transition-all peer-checked:bg-primary-fixed">
<span class="material-symbols-outlined text-[16px] text-surface-container-lowest font-bold opacity-0 transition-opacity peer-checked:opacity-100">check</span>
</div>
</label>
</form>
<!-- Contextual Coach Micro-Card -->
<div class="mt-6 flex items-center gap-3.5 p-3.5 rounded-2xl bg-secondary-container/20">
<div class="w-9 h-9 rounded-full bg-secondary-fixed flex items-center justify-center text-on-secondary-fixed shrink-0">
<span class="material-symbols-outlined text-[18px]">psychology</span>
</div>
<p class="font-body-sm text-body-sm text-secondary">
      You can update your baseline lifting weights and pacing parameters anytime in your settings.
    </p>
</div>
<!-- Bottom Fixed-Spacing CTA (Electric Lime kinetic pill) -->
<div class="w-full mt-8 pt-2">
<button class="w-full h-14 rounded-full bg-primary-fixed text-on-primary-fixed font-headline-sm text-label-lg tracking-wider font-bold flex items-center justify-center gap-2 hover:opacity-95 active:scale-[0.97] transition-all shadow-lg shadow-primary-container/20" id="continue-button" type="button">
<span>Continue</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
  (function () {
    const radioInputs = document.querySelectorAll('input[name="experience_level"]');
    const labels = document.querySelectorAll('form#experience-form > label');

    function updateCardVisuals() {
      labels.forEach((label) => {
        const input = label.querySelector('input');
        const iconContainer = label.querySelector('.rounded-xl');
        const checkCircle = label.querySelector('.rounded-full.w-6');
        const checkIcon = checkCircle ? checkCircle.querySelector('.material-symbols-outlined') : null;
        const textTitle = label.querySelector('.font-headline-sm');

        if (input.checked) {
          label.classList.add('bg-surface-container-high');
          label.classList.remove('bg-surface-container-low');
          
          if (iconContainer) {
            iconContainer.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
            iconContainer.classList.remove('bg-surface-container', 'text-on-surface-variant');
          }
          if (checkCircle) {
            checkCircle.classList.add('bg-primary-fixed');
            checkCircle.classList.remove('bg-surface-container-highest');
          }
          if (checkIcon) {
            checkIcon.classList.remove('opacity-0');
            checkIcon.classList.add('text-on-primary-fixed');
          }
          if (textTitle) {
            textTitle.classList.add('text-primary', 'font-bold');
            textTitle.classList.remove('text-on-surface');
          }
        } else {
          label.classList.remove('bg-surface-container-high');
          label.classList.add('bg-surface-container-low');

          if (iconContainer) {
            iconContainer.classList.remove('bg-primary-fixed', 'text-on-primary-fixed');
            iconContainer.classList.add('bg-surface-container', 'text-on-surface-variant');
          }
          if (checkCircle) {
            checkCircle.classList.remove('bg-primary-fixed');
            checkCircle.classList.add('bg-surface-container-highest');
          }
          if (checkIcon) {
            checkIcon.classList.add('opacity-0');
            checkIcon.classList.remove('text-on-primary-fixed');
          }
          if (textTitle) {
            textTitle.classList.remove('text-primary');
            textTitle.classList.add('text-on-surface');
          }
        }
      });
    }

    radioInputs.forEach((radio) => {
      radio.addEventListener('change', updateCardVisuals);
    });

    const continueBtn = document.getElementById('continue-button');
    if (continueBtn) {
      continueBtn.addEventListener('click', () => {
        const selected = document.querySelector('input[name="experience_level"]:checked')?.value;
        continueBtn.classList.add('scale-95');
        setTimeout(() => continueBtn.classList.remove('scale-95'), 150);
      });
    }
  })();
</script></main></body></html>
