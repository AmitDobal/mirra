<script>
  (function() {
    let timerSeconds = 90;
    let timerInterval = null;
    let isPaused = false;
    const restTimerEl = document.getElementById('rest-timer');
    const pauseBtn = document.getElementById('pause-toggle');
    const logSetBtn = document.getElementById('log-set-btn');

    function updateDisplay() {
      const minutes = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const seconds = (timerSeconds % 60).toString().padStart(2, '0');
      if (restTimerEl) {
        restTimerEl.textContent = `${minutes}:${seconds}`;
      }
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!isPaused && timerSeconds > 0) {
          timerSeconds--;
          updateDisplay();
        }
      }, 1000);
    }

    if (pauseBtn) {
      pauseBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        const icon = pauseBtn.querySelector('span');
        if (icon) {
          icon.textContent = isPaused ? 'play_arrow' : 'pause';
        }
      });
    }

    if (logSetBtn) {
      logSetBtn.addEventListener('click', () => {
        timerSeconds = 90;
        updateDisplay();
        logSetBtn.classList.add('scale-95');
        setTimeout(() => logSetBtn.classList.remove('scale-95'), 150);
      });
    }

    startTimer();
  })();
</script></main></body></html>
