<script>
  (function() {
    const pillGroup = document.getElementById('diet-pill-group');
    if (!pillGroup) return;

    pillGroup.addEventListener('click', (e) => {
      const pill = e.target.closest('.diet-pill');
      if (!pill) return;

      const isActive = pill.getAttribute('data-active') === 'true';
      const icon = pill.querySelector('.pill-icon');

      if (isActive) {
        pill.setAttribute('data-active', 'false');
        pill.classList.remove('bg-primary-fixed', 'text-surface');
        pill.classList.add('bg-surface-container', 'text-on-surface');
        if (icon) icon.classList.add('hidden');
      } else {
        pill.setAttribute('data-active', 'true');
        pill.classList.remove('bg-surface-container', 'text-on-surface');
        pill.classList.add('bg-primary-fixed', 'text-surface');
        if (icon) icon.classList.remove('hidden');
      }
    });
  })();
